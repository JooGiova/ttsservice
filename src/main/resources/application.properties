spring.application.name=ttsservice
server.port=8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Valori di default (segnaposto per ambienti senza Piper installato)
tts.piper.executable=piper
tts.piper.model-dir=./models
tts.piper.default-voice=it_IT-paola-medium.onnx
tts.temp-dir=./temp-audio

# Valori utilizzati per aumentare l'espressività del TTS
# (Valori di default ufficiali: silence=0.2, length=1.0, noise_scale=0.667, noise_w=0.8)
tts.piper.sentence-silence=0.3
tts.piper.length-scale=1.05
tts.piper.noise-scale=0.75
tts.piper.noise-w=0.8
